<!DOCTYPE html>
<html>
<head>
<title>NextGen Reviews</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    background: #FF6500;
    padding: 20px;
}

.box {
    max-width: 600px;
    margin: auto;
    background: #ADD8E6;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 15px #bbb;
}

.announcement-banner {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    border-left: 5px solid #FF6500;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.4;
    color: #333;
}

.announcement-banner a {
    color: #FF6500;
    font-weight: bold;
    text-decoration: none;
}

.announcement-banner a:hover {
    text-decoration: underline;
}

.info-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    padding: 10px;
    background: #FF6500;
    color: white;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
    font-size: 14px;
}

.info-btn:hover {
    background: #e05500;
}

h1 {
    text-align: center;
}

p {
    text-align: center;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #aaa;
    box-sizing: border-box;
}

textarea {
    height: 120px;
}

.stars {
    text-align: center;
    font-size: 45px;
    cursor: pointer;
    user-select: none;
}

.star {
    color: #ccc;
    transition: color .2s;
}

.star.active {
    color: gold;
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: black;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #333;
}

#message {
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<div class="announcement-banner">
    CawCleanzIt is now NextGen Labs! CawCleanzIt is shutting down cleaning services on December 31st, 2026. Want to try NextGen Labs? Book an appointment at <a href="mailto:nextgenfixers@proton.me">nextgenfixers@proton.me</a>
    <a href="https://nextgenfixers.vercel.app" target="_blank" class="info-btn">🌐 What is NextGen Labs?</a>
</div>

<h1>⭐ NextGen Reviews ⭐</h1>

<p>Tell us about your phone repairing experience!</p>

<label>Your Rating <span style="color:orange">*</span></label>

<div class="stars">
    <span class="star" onclick="setStars(1)">★</span>
    <span class="star" onclick="setStars(2)">★</span>
    <span class="star" onclick="setStars(3)">★</span>
    <span class="star" onclick="setStars(4)">★</span>
    <span class="star" onclick="setStars(5)">★</span>
</div>

<form id="reviewForm">

<input type="hidden" id="stars" name="stars">

<label>What did we repair?</label>
<input name="repaired" placeholder="Example: Wi-Fi" required>

<label>How long did it take?</label>
<input name="time" placeholder="Example: 15 minutes" required>

<label>Was it helpful?</label>

<select name="helpfulness">
    <option value="Absolutely!">Absolutely!</option>
    <option value="Yes!">Yes!</option>
    <option value="Average">Average</option>
    <option value="Could Be Better">Could Be Better</option>
    <option value="Not Really...">Not Really...</option>
</select>

<label>Name</label>
<input name="name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>What can we improve on?</label>
<textarea name="improve"></textarea>

<button type="submit">Send Review</button>

</form>

<div id="message"></div>

</div>

<script>

let selectedStars = 0;

function setStars(amount){

    selectedStars = amount;

    document.getElementById("stars").value = amount + "/5";

    const stars = document.querySelectorAll(".star");

    stars.forEach((star,index)=>{

        if(index < amount){
            star.classList.add("active");
        }else{
            star.classList.remove("active");
        }

    });

}

document.getElementById("reviewForm").onsubmit = async function(e){

    e.preventDefault();

    if(selectedStars === 0){
        alert("Please select a star rating before submitting your review.");
        return;
    }

    const data = Object.fromEntries(new FormData(this));

    const response = await fetch("/api/review",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(data)
    });

    if(response.ok){

        document.getElementById("message").innerHTML =
        "✅ Thanks! Your review was sent.";

        this.reset();

        selectedStars = 0;
        document.getElementById("stars").value = "";

        document.querySelectorAll(".star").forEach(star=>{
            star.classList.remove("active");
        });

    }else{

        document.getElementById("message").innerHTML =
        "❌ Something went wrong.";

    }

};

</script>

</body>
</html>
